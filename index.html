<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#16241b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlantDaddy">
  <title>PlantDaddy · Field Journal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="PlantDaddy home">
      <svg class="brand-leaf" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C7 6 4 10.5 4 14.5A7.5 7.5 0 0 0 11.5 22h.5c.2-3-.4-6.6-2.6-10.1c2.7 2.7 4.3 6.1 4.7 10A7.5 7.5 0 0 0 20 14.5C20 10.5 17 6 12 2Z"/></svg>
      <span class="brand-name">PlantDaddy</span>
      <span class="brand-sub">field journal</span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="#/" data-nav="dashboard">Today</a>
      <a href="#/plants" data-nav="plants">Collection</a>
      <a href="#/journal" data-nav="journal">Journal</a>
      <a href="#/settings" data-nav="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8Zm9.4 4a7.6 7.6 0 0 0-.1-1.2l2-1.6l-2-3.4l-2.4 1a7.6 7.6 0 0 0-2-1.2L16.5 3h-4l-.4 2.6a7.6 7.6 0 0 0-2 1.2l-2.4-1l-2 3.4l2 1.6a7.7 7.7 0 0 0 0 2.4l-2 1.6l2 3.4l2.4-1a7.6 7.6 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 2-1.2l2.4 1l2-3.4l-2-1.6c.06-.4.1-.8.1-1.2Z"/></svg>
      </a>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <div class="loading">Opening the journal…</div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
